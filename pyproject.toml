[project]
name = "diffusers-mm"
version = "0.3.0"
description = "Smart model management for Hugging Face Diffusers pipelines"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Alvaro Somoza", email = "zcodeweb@gmail.com" }]
requires-python = ">=3.10"
keywords = ["diffusers", "huggingface", "offload", "vram", "model-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/asomoza/diffusers-mm"
Repository = "https://github.com/asomoza/diffusers-mm"
Issues = "https://github.com/asomoza/diffusers-mm/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
]
test = [
    "pytest>=9",
    "pytest-cov>=7",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffusers_mm"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["diffusers_mm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a CUDA device (opt-in via DIFFUSERS_MM_RUN_GPU_TESTS=1)",
    "slow: long-running tests (opt-in)",
]
